version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: medgraph-falkordb
    ports:
      - "6379:6379"
      - "3001:3000"
    restart: unless-stopped
    networks:
      - medgraph-network

  postgres:
    image: postgres:16-alpine
    container_name: medgraph-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: medgraph_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - medgraph-network

volumes:
  postgres-data:

networks:
  medgraph-network:
    driver: bridge
